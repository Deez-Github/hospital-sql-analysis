<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" width="1060" height="540" role="img" aria-label="Entity relationship diagram: Doctors one-to-many Patients">
<rect width="1060" height="540" fill="#FBFAF7"/>
<text x="60" y="46" font-family="Georgia,serif" font-size="21" font-weight="600" fill="#0B2027">Schema: one physician, many admissions</text>
<text x="60" y="70" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#5C6B73">Doctors is the parent table; Patients references it through Doctor_ID. The constraint FK_Patients_Doctors prevents orphan admissions.</text>
<rect x="60" y="132" width="330" height="158" rx="8" fill="#FFFFFF" stroke="#E5E3DB" stroke-width="1.2"/><path d="M68 132 H382 A8 8 0 0 1 390 140 V182 H60 V140 A8 8 0 0 1 68 132 Z" fill="#0B2027"/><text x="78" y="158" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Doctors</text><text x="372" y="158" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="11" fill="#9CC2C1">3 rows</text><rect x="78" y="191" width="26" height="15" rx="3" fill="#E4B363" opacity="0.18"/><text x="91" y="202" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="9.5" font-weight="700" fill="#E4B363">PK</text><text x="112" y="203" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#0B2027">Doctor_ID</text><text x="372" y="203" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">INT</text><line x1="61" y1="214" x2="389" y2="214" stroke="#F1EFE9"/><rect x="78" y="223" width="26" height="15" rx="3" fill="#D96C5F" opacity="0.18"/><text x="91" y="234" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="9.5" font-weight="700" fill="#D96C5F">UQ</text><text x="112" y="235" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#0B2027">Doctor_Name</text><text x="372" y="235" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">VARCHAR(100)</text><line x1="61" y1="246" x2="389" y2="246" stroke="#F1EFE9"/><text x="78" y="267" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#33444B">Specialization</text><text x="372" y="267" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">VARCHAR(60)</text>
<rect x="600" y="60" width="400" height="414" rx="8" fill="#FFFFFF" stroke="#E5E3DB" stroke-width="1.2"/><path d="M608 60 H992 A8 8 0 0 1 1000 68 V110 H600 V68 A8 8 0 0 1 608 60 Z" fill="#0B2027"/><text x="618" y="86" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Patients</text><text x="982" y="86" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="11" fill="#9CC2C1">10 rows</text><rect x="618" y="119" width="26" height="15" rx="3" fill="#E4B363" opacity="0.18"/><text x="631" y="130" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="9.5" font-weight="700" fill="#E4B363">PK</text><text x="652" y="131" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#0B2027">Patient_ID</text><text x="982" y="131" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">INT</text><line x1="601" y1="142" x2="999" y2="142" stroke="#F1EFE9"/><text x="618" y="163" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#33444B">Patient_Name</text><text x="982" y="163" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">VARCHAR(100)</text><line x1="601" y1="174" x2="999" y2="174" stroke="#F1EFE9"/><text x="618" y="195" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#33444B">Age</text><text x="982" y="195" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">INT</text><line x1="601" y1="206" x2="999" y2="206" stroke="#F1EFE9"/><text x="618" y="227" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#33444B">Gender</text><text x="982" y="227" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">VARCHAR(10)</text><line x1="601" y1="238" x2="999" y2="238" stroke="#F1EFE9"/><text x="618" y="259" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#33444B">City</text><text x="982" y="259" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">VARCHAR(60)</text><line x1="601" y1="270" x2="999" y2="270" stroke="#F1EFE9"/><text x="618" y="291" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#33444B">Condition</text><text x="982" y="291" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">VARCHAR(60)</text><line x1="601" y1="302" x2="999" y2="302" stroke="#F1EFE9"/><text x="618" y="323" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#33444B">Admission_Type</text><text x="982" y="323" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">VARCHAR(20)</text><line x1="601" y1="334" x2="999" y2="334" stroke="#F1EFE9"/><rect x="618" y="343" width="26" height="15" rx="3" fill="#D96C5F" opacity="0.18"/><text x="631" y="354" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="9.5" font-weight="700" fill="#D96C5F">FK</text><text x="652" y="355" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#0B2027">Doctor_ID</text><text x="982" y="355" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">INT</text><line x1="601" y1="366" x2="999" y2="366" stroke="#F1EFE9"/><text x="618" y="387" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#33444B">Admission_Date</text><text x="982" y="387" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">DATE</text><line x1="601" y1="398" x2="999" y2="398" stroke="#F1EFE9"/><text x="618" y="419" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#33444B">Length_of_Stay</text><text x="982" y="419" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">INT</text><line x1="601" y1="430" x2="999" y2="430" stroke="#F1EFE9"/><text x="618" y="451" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#33444B">Treatment_Status</text><text x="982" y="451" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#8A959A">VARCHAR(20)</text>
<path d="M390 198 H490 V350 H586" fill="none" stroke="#147D7A" stroke-width="1.8"/><circle cx="390" cy="198" r="3.4" fill="#147D7A"/><text x="406" y="187" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#147D7A">1</text><text x="594" y="335" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#147D7A">N</text><g stroke="#147D7A" stroke-width="1.8"><line x1="586" y1="350" x2="600" y2="341"/><line x1="586" y1="350" x2="600" y2="350"/><line x1="586" y1="350" x2="600" y2="359"/></g>
<g font-family="Inter,Arial,sans-serif" font-size="11">
  <rect x="60" y="440" width="14" height="14" rx="3" fill="#E4B363" opacity="0.18"/><text x="80" y="451" fill="#5C6B73">Primary key</text>
  <rect x="164" y="440" width="14" height="14" rx="3" fill="#D96C5F" opacity="0.18"/><text x="184" y="451" fill="#5C6B73">Foreign key</text>
  <text x="60" y="486" fill="#5C6B73">Referential integrity checks (sql/08) confirm every Patient.Doctor_ID resolves to a row in Doctors:</text>
  <text x="60" y="506" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#147D7A">SELECT COUNT(*) FROM Patients p LEFT JOIN Doctors d ON d.Doctor_ID = p.Doctor_ID WHERE d.Doctor_ID IS NULL;  -- 0</text>
</g>
</svg>